plugins {
    id "org.openapi.generator" version "7.12.0"
}

openApiGenerate {
    generatorName = 'spring'
    inputSpec = file("$projectDir/src/main/resources/openapi/openapi.yaml")
            .toURI()
            .toString()
    outputDir = "$buildDir/generated/openapi"

    apiPackage = 'ru.yandex.market.payment.api'
    modelPackage = 'ru.yandex.market.payment.api.model'

    configOptions = [
            interfaceOnly: 'true',
            useSpringBoot3: 'true',
            reactive: 'true',
            dateLibrary: 'java8',
            useTags: 'true',
            skipDefaultInterface: 'true'
    ]
}

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/openapi/src/main/java"
        }
    }
}

compileJava.dependsOn tasks.openApiGenerate

dependencies {
    implementation 'org.springframework:spring-webflux'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.28'
    implementation 'io.swagger.core.v3:swagger-core:2.2.28'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'jakarta.validation:jakarta.validation-api'
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}
