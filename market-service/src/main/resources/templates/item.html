<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Item</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <header class="header">
        <h2 class="brand">Карточка товара</h2>
        <nav class="nav">
            <a th:href="@{/items}">Витрина</a>
            <span th:if="${authenticated}">
                <a th:href="@{/cart/items}">Корзина</a>
                <a th:href="@{/orders}">Заказы</a>
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit">Выйти</button>
                </form>
            </span>
            <span th:unless="${authenticated}">
                <a th:href="@{/login}">Войти</a>
                <a th:href="@{/register}">Регистрация</a>
            </span>
        </nav>
    </header>

    <div class="card single-card">
        <img class="item-img" th:src="${item.imgPath()}" alt="item image"/>
        <h3 class="item-title" th:text="${item.title()}"></h3>
        <p class="item-description" th:text="${item.description()}"></p>
        <p class="item-price" th:text="${item.price() + ' руб.'}"></p>
        <p class="item-count" th:if="${authenticated}" th:text="${'В корзине: ' + item.count()}"></p>

        <div class="actions" th:if="${authenticated}">
            <form th:action="|/items/${item.id()}?action=MINUS|" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit">-</button>
            </form>
            <form th:action="|/items/${item.id()}?action=PLUS|" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit">+</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
