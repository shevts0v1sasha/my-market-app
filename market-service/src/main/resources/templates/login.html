<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <header class="header">
        <h2 class="brand">Вход</h2>
        <nav class="nav">
            <a th:href="@{/items}">Витрина</a>
            <a th:href="@{/register}">Регистрация</a>
        </nav>
    </header>

    <div class="card single-card">
        <p th:if="${showRegistered}" class="success">Регистрация успешна. Войдите в аккаунт.</p>
        <p th:if="${showError}" class="error">Неверный логин или пароль</p>
        <p th:if="${showLogout}" class="success">Вы вышли из аккаунта</p>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label>
                Логин
                <input type="text" name="username" required autofocus/>
            </label>
            <label>
                Пароль
                <input type="password" name="password" required/>
            </label>
            <button type="submit">Войти</button>
        </form>
    </div>
</div>
</body>
</html>
