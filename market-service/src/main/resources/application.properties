spring.application.name=MarketApp
server.port=8080
management.server.port=8101

spring.r2dbc.username=postgres
spring.r2dbc.password=postgres
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/postgres

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.liquibase.contexts=dev
spring.liquibase.url=jdbc:postgresql://localhost:5432/postgres
spring.liquibase.user=postgres
spring.liquibase.password=postgres

spring.sql.init.mode=never

spring.data.redis.host=localhost
spring.data.redis.port=6379

cache.items.ttl-minutes=2

payment-service.base-url=http://localhost:8081

spring.security.oauth2.client.registration.payment-service.provider=payment-service
spring.security.oauth2.client.registration.payment-service.client-id=market-service
spring.security.oauth2.client.registration.payment-service.client-secret=market-service-secret
spring.security.oauth2.client.registration.payment-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.payment-service.scope=payment.read,payment.write
spring.security.oauth2.client.provider.payment-service.token-uri=http://localhost:9000/oauth2/token

management.endpoints.web.exposure.include=health,info
